name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/openclaw/openclaw.git || true
          git fetch upstream main

      - name: Sync main with upstream (exclude .github/workflows)
        run: |
          git checkout main
          git checkout upstream/main -- .
          git restore --source=HEAD --staged --worktree .github/workflows || true
          if git diff --quiet && git diff --cached --quiet; then
            echo "No non-workflow changes to sync"
            exit 0
          fi
          git add -A
          git commit -m "Sync upstream main (excluding workflow files)"
          git push origin main

      - name: Summary
        run: echo "Synced non-workflow changes from upstream/main"
